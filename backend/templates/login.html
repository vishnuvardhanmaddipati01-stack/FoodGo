<script>

    const API_BASE_URL = "/api";


    const mobileInput =
        document.getElementById("mobile");

    const otpInput =
        document.getElementById("otp");

    const otpSection =
        document.getElementById("otpSection");

    const sendOtpButton =
        document.getElementById("sendOtpButton");

    const verifyOtpButton =
        document.getElementById("verifyOtpButton");

    const message =
        document.getElementById("loginMessage");


    let currentMobile = "";


    /* ================================
       SEND OTP
    ================================= */

    sendOtpButton.addEventListener(
        "click",
        function() {

            const mobile =
                mobileInput.value.trim();


            if (!/^[0-9]{10}$/.test(mobile)) {

                message.textContent =
                    "Please enter a valid 10-digit mobile number.";

                message.style.color =
                    "#dc2626";

                return;
            }


            currentMobile = mobile;


            message.textContent =
                "OTP sent successfully. For demo login, use 123456.";

            message.style.color =
                "#059669";


            otpSection.style.display =
                "block";


            sendOtpButton.style.display =
                "none";


            otpInput.focus();

        }
    );


    /* ================================
       VERIFY OTP
    ================================= */

    verifyOtpButton.addEventListener(
        "click",
        async function() {

            const otp =
                otpInput.value.trim();


            if (otp !== "123456") {

                message.textContent =
                    "Invalid OTP. For demo use 123456.";

                message.style.color =
                    "#dc2626";

                return;
            }


            if (!currentMobile) {

                message.textContent =
                    "Please enter your mobile number first.";

                message.style.color =
                    "#dc2626";

                return;
            }


            verifyOtpButton.disabled =
                true;

            verifyOtpButton.textContent =
                "Logging in...";


            try {

                /* ================================
                   GET CUSTOMER
                ================================= */

                const response =
                    await fetch(
                        API_BASE_URL +
                        "/customers/?mobile=" +
                        encodeURIComponent(currentMobile)
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        "Customer API error: " +
                        response.status +
                        " - " +
                        errorText
                    );

                }


                const customers =
                    await response.json();


                let customer =
                    null;


                /* ================================
                   FIND CUSTOMER
                ================================= */

                if (Array.isArray(customers)) {

                    customer =
                        customers.find(
                            function(item) {

                                return String(item.mobile) ===
                                    String(currentMobile);

                            }
                        );

                }


                /* ================================
                   CREATE CUSTOMER
                ================================= */

                if (!customer) {

                    const createResponse =
                        await fetch(
                            API_BASE_URL +
                            "/customers/",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    mobile:
                                        currentMobile,

                                    name:
                                        "FoodGo Customer"

                                })
                            }
                        );


                    if (!createResponse.ok) {

                        const errorText =
                            await createResponse.text();

                        throw new Error(
                            "Customer creation failed: " +
                            createResponse.status +
                            " - " +
                            errorText
                        );

                    }


                    customer =
                        await createResponse.json();

                }


                /* ================================
                   CHECK CUSTOMER ID
                ================================= */

                if (!customer || !customer.id) {

                    throw new Error(
                        "Customer information was not returned by the server."
                    );

                }


                /* ================================
                   SAVE LOGIN
                ================================= */

                localStorage.setItem(
                    "foodgoLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "foodgoCustomerId",
                    String(customer.id)
                );


                localStorage.setItem(
                    "foodgoMobile",
                    currentMobile
                );


                localStorage.setItem(
                    "foodgoCustomerName",
                    customer.name ||
                    "FoodGo Customer"
                );


                /* ================================
                   SUCCESS
                ================================= */

                message.textContent =
                    "Login successful! Redirecting...";

                message.style.color =
                    "#059669";


                setTimeout(
                    function() {

                        window.location.href =
                            "/restaurants/";

                    },
                    700
                );

            }


            catch (error) {

                console.error(
                    "FoodGo Login Error:",
                    error
                );


                message.textContent =
                    "Login failed: " +
                    error.message;


                message.style.color =
                    "#dc2626";


                verifyOtpButton.disabled =
                    false;


                verifyOtpButton.textContent =
                    "Verify & Login";

            }

        }
    );


    /* ================================
       ONLY NUMBERS - MOBILE
    ================================= */

    mobileInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value.replace(
                    /[^0-9]/g,
                    ""
                );

        }
    );


    /* ================================
       ONLY NUMBERS - OTP
    ================================= */

    otpInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value.replace(
                    /[^0-9]/g,
                    ""
                );

        }
    );

</script>
