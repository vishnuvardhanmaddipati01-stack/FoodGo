{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FoodGo - Profile</title>

    <link rel="stylesheet"
        href="{% static 'style.css' %}">

</head>

<body>

    <header>

        <h1>FoodGo</h1>

        <a href="/restaurants/">
            Home
        </a>

    </header>


    <main>

        <h2>My Profile</h2>


        <div class="profile-card">

            <h3>Customer Details</h3>


            <label>
                Name
            </label>

            <input
                type="text"
                id="profileName"
                placeholder="Enter your name"
            >


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="profileMobile"
                placeholder="Mobile number"
                readonly
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
                placeholder="Enter email"
            >


            <label>
                Delivery Location
            </label>

            <textarea
                id="profileAddress"
                placeholder="Enter your delivery address"
                rows="4"
            ></textarea>


            <button
                type="button"
                onclick="getCurrentLocation()"
            >
                📍 Use My Current Location
            </button>


            <p id="locationMessage"></p>


            <button
                type="button"
                onclick="saveProfile()"
            >
                Save Profile
            </button>


            <p id="profileMessage"></p>

        </div>


        <div class="profile-links">

            <button
                type="button"
                onclick="window.location.href='/orders/'"
            >
                My Orders
            </button>


            <button
                type="button"
                onclick="window.location.href='/cart/'"
            >
                My Cart
            </button>


            <button
                type="button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </main>


    <script>

        const API_BASE_URL = "/api";


        const customerId =
            localStorage.getItem(
                "foodgoCustomerId"
            );


        /*
         * LOAD PROFILE
         */

        async function loadProfile() {

            if (!customerId) {

                alert(
                    "Please login first."
                );

                window.location.href =
                    "/login/";

                return;

            }


            try {

                const response =
                    await fetch(
                        API_BASE_URL +
                        "/customers/" +
                        customerId +
                        "/"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load customer."
                    );

                }


                const customer =
                    await response.json();


                document.getElementById(
                    "profileName"
                ).value =
                    customer.name || "";


                document.getElementById(
                    "profileMobile"
                ).value =
                    customer.mobile || "";


                document.getElementById(
                    "profileEmail"
                ).value =
                    customer.email || "";


                document.getElementById(
                    "profileAddress"
                ).value =
                    customer.address || "";


            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    "profileMessage"
                ).innerText =
                    "Unable to load profile.";

            }

        }


        /*
         * GET CURRENT LOCATION
         */

        function getCurrentLocation() {

            const locationMessage =
                document.getElementById(
                    "locationMessage"
                );


            if (!navigator.geolocation) {

                locationMessage.innerText =
                    "Location is not supported by this browser.";

                return;

            }


            locationMessage.innerText =
                "Getting your location...";


            navigator.geolocation.getCurrentPosition(

                async function(position) {

                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;


                    try {

                        locationMessage.innerText =
                            "Finding your area...";


                        const response =
                            await fetch(
                                "https://nominatim.openstreetmap.org/reverse" +
                                "?format=json" +
                                "&lat=" +
                                latitude +
                                "&lon=" +
                                longitude +
                                "&zoom=18" +
                                "&addressdetails=1"
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Unable to find address"
                            );

                        }


                        const data =
                            await response.json();


                        const address =
                            data.address || {};


                        /*
                         * GET AREA / PLACE
                         */

                        const area =
                            address.suburb ||
                            address.neighbourhood ||
                            address.quarter ||
                            address.residential ||
                            address.village ||
                            address.town ||
                            "";


                        /*
                         * GET CITY
                         */

                        const city =
                            address.city ||
                            address.town ||
                            address.municipality ||
                            address.city_district ||
                            "";


                        /*
                         * GET STATE
                         */

                        const state =
                            address.state ||
                            "";


                        /*
                         * BUILD READABLE LOCATION
                         */

                        const parts = [];


                        if (area) {

                            parts.push(area);

                        }


                        if (
                            city &&
                            city !== area
                        ) {

                            parts.push(city);

                        }


                        if (state) {

                            parts.push(state);

                        }


                        const readableLocation =
                            parts.join(", ");


                        if (readableLocation) {

                            document.getElementById(
                                "profileAddress"
                            ).value =
                                readableLocation;


                            locationMessage.innerText =
                                "📍 Location found: " +
                                readableLocation;

                        }

                        else {

                            locationMessage.innerText =
                                "Could not find a readable area name.";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        locationMessage.innerText =
                            "Unable to convert your location into an area name.";

                    }

                },


                function(error) {

                    console.error(error);


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        locationMessage.innerText =
                            "Location permission was denied.";

                    }

                    else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        locationMessage.innerText =
                            "Your location is currently unavailable.";

                    }

                    else {

                        locationMessage.innerText =
                            "Unable to get your location.";

                    }

                },


                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000
                }

            );

        }


        /*
         * SAVE PROFILE
         */

        async function saveProfile() {

            const name =
                document.getElementById(
                    "profileName"
                ).value.trim();


            const email =
                document.getElementById(
                    "profileEmail"
                ).value.trim();


            const address =
                document.getElementById(
                    "profileAddress"
                ).value.trim();


            const message =
                document.getElementById(
                    "profileMessage"
                );


            if (name === "") {

                message.innerText =
                    "Please enter your name.";

                return;

            }


            try {

                const response =
                    await fetch(
                        API_BASE_URL +
                        "/customers/" +
                        customerId +
                        "/",
                        {

                            method: "PATCH",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    email:
                                        email,

                                    address:
                                        address

                                })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to save profile."
                    );

                }


                const customer =
                    await response.json();


                localStorage.setItem(
                    "foodgoCustomerName",
                    customer.name || ""
                );


                message.innerText =
                    "Profile saved successfully!";

            }


            catch (error) {

                console.error(error);

                message.innerText =
                    "Unable to save profile.";

            }

        }


        /*
         * LOGOUT
         */

        function logout() {

            localStorage.removeItem(
                "foodgoLoggedIn"
            );


            localStorage.removeItem(
                "foodgoCustomerId"
            );


            localStorage.removeItem(
                "foodgoMobile"
            );


            localStorage.removeItem(
                "foodgoCustomerName"
            );


            alert(
                "You have been logged out."
            );


            window.location.href =
                "/login/";

        }


        /*
         * START PAGE
         */

        loadProfile();

    </script>

</body>

</html>
