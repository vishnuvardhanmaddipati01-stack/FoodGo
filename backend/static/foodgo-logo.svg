<svg
    width="220"
    height="70"
    viewBox="0 0 220 70"
    xmlns="http://www.w3.org/2000/svg">

    <!-- =========================
         FOOD ICON
    ========================== -->

    <!-- Green food dome -->
    <path
        d="M25 39
           C25 20 41 9 60 9
           C79 9 95 20 95 39
           Z"
        fill="#047857"
    />

    <!-- Small green top -->
    <circle
        cx="60"
        cy="8"
        r="4"
        fill="#10B981"
    />

    <!-- Orange food layer -->
    <path
        d="M19 38
           C38 43 76 43 101 35
           L101 43
           C78 52 40 52 19 44
           Z"
        fill="#F97316"
    />

    <!-- Green lower layer -->
    <path
        d="M20 45
           C42 53 77 53 99 44
           L95 51
           C72 60 43 60 24 51
           Z"
        fill="#10B981"
    />

    <!-- Plate -->
    <path
        d="M16 55
           C37 63 77 64 103 53"
        fill="none"
        stroke="#047857"
        stroke-width="5"
        stroke-linecap="round"
    />


    <!-- =========================
         LEAF
    ========================== -->

    <path
        d="M79 19
           C88 8 101 6 111 8
           C108 21 97 29 82 28
           Z"
        fill="#10B981"
    />

    <path
        d="M84 25
           C91 19 99 14 108 10"
        fill="none"
        stroke="#047857"
        stroke-width="2"
        stroke-linecap="round"
    />


    <!-- =========================
         SPEED LINES
    ========================== -->

    <rect
        x="4"
        y="28"
        width="17"
        height="5"
        rx="2.5"
        fill="#10B981"
    />

    <rect
        x="1"
        y="38"
        width="20"
        height="5"
        rx="2.5"
        fill="#047857"
    />


    <!-- =========================
         FOODGO TEXT
    ========================== -->

    <text
        x="120"
        y="43"
        font-family="Arial, Helvetica, sans-serif"
        font-size="29"
        font-weight="800"
        fill="#064E3B">
        Food
    </text>

    <text
        x="180"
        y="43"
        font-family="Arial, Helvetica, sans-serif"
        font-size="29"
        font-weight="800"
        fill="#F97316">
        Go
    </text>

</svg>